name: CI & Publish

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Consumer (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - run: bun ci
      - run: bun run build
      - name: Check the installed tarball in Node, Bun, and TypeScript
        run: node scripts/check-package.mjs

  verify:
    needs: consumer
    if: ${{ always() }}
    name: Verify
    runs-on: ubuntu-latest
    # A cold Chromium/system-dependency install can take eight minutes alone.
    # Leave time for coverage, mutations, visual goldens, and release packaging.
    timeout-minutes: 20
    steps:
      - name: Require every package consumer to pass
        if: needs.consumer.result != 'success'
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Setup supported Node.js runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install dependencies
        run: bun ci

      - name: Install Chromium for visual goldens
        run: bunx playwright install --with-deps chromium

      - name: Type-check
        run: bun run check

      - name: Build package
        run: bun run build

      - name: Enforce compiler size budget
        run: bun run size

      - name: Fuzz the compile and diagnose contract
        run: bun run test:fuzz:contract

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          echo "### Vitest Test & Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          echo '```txt' >> "$GITHUB_STEP_SUMMARY"
          bun run test:coverage | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Kill critical-path mutants
        run: bun run test:mutation

      - name: Verify Chromium visual goldens
        run: bun run test:visual

      # A tag is checked here, before the publish job can start: a version
      # that does not match package.json, or that CHANGELOG.md never wrote
      # down, must stop the release before npm has it, not after.
      - name: Verify release commit belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release tag and changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(bun -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v${package_version}." >&2
            exit 1
          fi
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > /dev/null

      - name: Pack the verified release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"

      - name: Preserve the verified release tarball
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `contents: write` cuts the GitHub Release; `id-token` is npm trusted publishing.
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Verify release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v${package_version}" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v${package_version}." >&2
            exit 1
          fi

      # The changelog section for this tag becomes the release body, so the
      # prose is written once. Downstream consumers — the website's release
      # snapshot among them — read it from the API instead of copying it. It
      # is extracted to a file before anything is published, so a missing
      # section stops the job while npm still has nothing.
      - name: Extract release notes
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Download the verified package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish to npm
        shell: bash
        run: |
          packages=("$RUNNER_TEMP"/npm-package/*.tgz)
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
            echo "Expected exactly one verified package tarball." >&2
            exit 1
          fi
          npm_tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then npm_tag=next; fi
          npm publish "${packages[0]}" --access public --tag "$npm_tag" --ignore-scripts

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
